[package]
name = "roq"
version = "0.3.1"
edition = "2021"
authors = ["yuanfang"]
description = "Read-only MySQL query CLI — 三层强制只读的数据库安全查询工具"
license = "MIT"

[dependencies]
mysql = "26"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
